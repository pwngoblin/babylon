!
version 17.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service tcp-small-servers
no service udp-small-servers
no ip finger
no ip bootp server
no ip source-route
no cdp run
!
hostname edge-r2
!
aaa new-model
aaa authentication login default group tacacs+ local
enable secret 9 $9$abcdefghijklmnop$qrstuvwxyz0123456789abcdefghijklmnopqrstuvw
!
username admin secret 9 $9$zyxwvutsrqponmlk$0123456789abcdefghijklmnopqrstuvwxyzabcdef
!
ip domain-name lab.local
no ip http server
ip http secure-server
ip ssh version 2
!
logging host 10.0.0.50
ntp server 10.0.0.60
!
snmp-server group MON v3 priv
!
banner login ^C
Authorized access only.
^C
!
access-list 10 permit 10.0.0.0 0.0.0.255
!
line con 0
 exec-timeout 5 0
line vty 0 15
 access-class 10 in
 exec-timeout 10 0
 transport input ssh
!
end
