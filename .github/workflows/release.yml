name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write   # keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go test -short -timeout 10m ./...
      - name: Build
        run: |
          set -e
          mkdir dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X babylon/internal/cli.Version=${GITHUB_REF_NAME}" -o dist/babylon-${os}-${arch}${ext} ./cmd/babylon
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: SBOM
        uses: anchore/sbom-action@v0
        with: {path: ., format: spdx-json, output-file: dist/babylon.spdx.json, upload-artifact: false}
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Publish
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $pre
