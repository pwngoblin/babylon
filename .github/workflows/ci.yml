name: ci
on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows has never been run for real; keep it visible but non-blocking until it is.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -short -race -timeout 10m ./...

  security:
    name: govulncheck and staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

  lab-manifest:
    name: lab manifest is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go test -short -run 'TestRepoManifestIsValid' ./internal/lab
